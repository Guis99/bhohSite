{{ define "main" }}
  <article class="post">
    <header class="page-header">
      <h1 class="page-title">{{ .Title }}</h1>
      {{- if not .Date.IsZero }}
        <time class="page-meta" datetime="{{ .Date | time.Format "2006-01-02T15:04:05-07:00" }}">
          {{ .Date | time.Format ":date_long" }}
        </time>
      {{- end }}
    </header>

    <div class="prose">
      {{ .Content }}
    </div>

    {{ partial "terms.html" (dict "taxonomy" "tags" "page" .) }}

    {{- with .CurrentSection }}
      {{- if .IsSection }}
        <p class="back"><a href="{{ .RelPermalink }}">&larr; Back to {{ .LinkTitle }}</a></p>
      {{- end }}
    {{- end }}
  </article>
{{ end }}
