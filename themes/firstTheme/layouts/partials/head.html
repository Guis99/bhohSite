<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ printf "%s | %s" .Title site.Title }}{{ end }}</title>
{{ with or .Description site.Params.description }}<meta name="description" content="{{ . }}">{{ end }}
<script>
  // Set --max-text-width from the physical screen so the container caps at 75% of
  // it; without this the CSS fallback (1400px) is used. Runs synchronously in
  // <head> to avoid a layout flash. Does not re-run when the window moves to a
  // different monitor; reload to update.
  document.documentElement.style.setProperty('--max-text-width',
    Math.round(window.screen.width * 0.75) + 'px');

  // Apply saved (or system-preferred) theme BEFORE first paint so the page
  // never flashes light when the user has chosen dark.
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (_) {}
  })();
</script>
<link rel="icon" href="{{ "favicon.ico" | relURL }}">
{{ partialCached "head/css.html" . }}
{{ partialCached "head/js.html" . }}
