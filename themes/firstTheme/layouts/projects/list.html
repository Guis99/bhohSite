{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  
  <div class="grid grid-cols-2 gap-3">
  {{ range .Pages }}
    <div class="border border-blue-500 rounded px-4 py-2">    
        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
        {{ .Summary }}
    </div>

  {{ end }}
</div>
{{ end }}
